{{define "content"}}
<h1 style="margin:0 0 10px 0;">Favorites</h1>
{{if not .Items}}
  <div class="card">No favorites yet. Browse <a href="/recipes">recipes</a> and add some.</div>
{{else}}
  <div class="grid">
    {{range .Items}}
      <div class="card">
        <div class="row" style="justify-content: space-between;">
          <span class="badge" data-category="{{.Category}}">{{.Category}}</span>
          <form method="post" action="/recipes/{{.Slug}}/plan" style="margin:0">
            <button class="btn" type="submit">{{if .InWeeksPlan}}✓ In this week{{else}}+ Add to week{{end}}</button>
          </form>
        </div>
        <h3><a href="/recipes/{{.Slug}}">{{.Title}}</a></h3>
        <p>{{.Description}}</p>
      </div>
    {{end}}
  </div>
{{end}}
{{end}}

{{define "favorites.html"}}{{template "base" .}}{{end}}
