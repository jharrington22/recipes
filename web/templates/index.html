{{define "content"}}
<h1 style="margin:0 0 6px 0;">Latest recipes</h1>
<div class="small">Try the search page for include/exclude ingredients.</div>

<div class="grid">
  {{range .Items}}
    <div class="card">
      <div class="row" style="justify-content: space-between;">
        <span class="badge" data-category="{{.Category}}">{{.Category}}</span>
        {{if $.Authed}}
          <div class="row" style="gap:6px;">
            <form method="post" action="/recipes/{{.Slug}}/favorite" style="margin:0">
              <button class="btn" type="submit">{{if .IsFavorite}}★ Favorited{{else}}☆ Favorite{{end}}</button>
            </form>
            <form method="post" action="/recipes/{{.Slug}}/plan" style="margin:0">
              <button class="btn" type="submit">{{if .InWeeksPlan}}✓ In this week{{else}}+ Add to week{{end}}</button>
            </form>
          </div>
        {{end}}
      </div>
      <h3><a href="/recipes/{{.Slug}}">{{.Title}}</a></h3>
      <p>{{.Description}}</p>
    </div>
  {{end}}
</div>
{{end}}

{{define "index.html"}}{{template "base" .}}{{end}}
