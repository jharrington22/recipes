{{define "content"}}
<h1 style="margin:0 0 10px 0;">Recipes</h1>

<form method="get" action="/recipes" class="row">
  <select name="category">
    <option value="">All categories</option>
    <option value="breakfast" {{if eq .Query.category "breakfast"}}selected{{end}}>Breakfast</option>
    <option value="lunch" {{if eq .Query.category "lunch"}}selected{{end}}>Lunch</option>
    <option value="dinner" {{if eq .Query.category "dinner"}}selected{{end}}>Dinner</option>
  </select>
  <input class="input" name="q" placeholder="Search by name…" value="{{.Query.q}}" />
  <input class="input" name="include" placeholder="Include ingredients (csv)" value="{{.Query.include}}" />
  <input class="input" name="exclude" placeholder="Exclude ingredients (csv)" value="{{.Query.exclude}}" />
  <button class="btn primary" type="submit">Search</button>
</form>

<div class="grid">
  {{range .Items}}
    <div class="card">
      <div class="row" style="justify-content: space-between;">
        <span class="badge" data-category="{{.Category}}">{{.Category}}</span>
        {{if $.Authed}}
          <div class="row" style="gap:6px;">
            <form method="post" action="/recipes/{{.Slug}}/favorite" style="margin:0">
              <button class="btn{{if .IsFavorite}} active{{end}}" type="submit">{{if .IsFavorite}}{{template "icon-heart-filled"}}Favorited{{else}}{{template "icon-heart"}}Favorite{{end}}</button>
            </form>
            <form method="post" action="/recipes/{{.Slug}}/plan" style="margin:0">
              <button class="btn{{if .InWeeksPlan}} active{{end}}" type="submit">{{if .InWeeksPlan}}{{template "icon-check-circle"}}In this week{{else}}{{template "icon-plus-circle"}}Add to week{{end}}</button>
            </form>
          </div>
        {{end}}
      </div>
      <h3><a href="/recipes/{{.Slug}}">{{.Title}}</a></h3>
      <p>{{.Description}}</p>
    </div>
  {{end}}
</div>
{{end}}

{{define "recipes.html"}}{{template "base" .}}{{end}}
