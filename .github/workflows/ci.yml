name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  validate-recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # Checks every file in recipes/ against the schema in CONTRIBUTING.md.
      # Problems are reported as inline annotations on the pull request via
      # ::error workflow commands, then compiled to a JSON artifact
      # (build/recipes.json, attached below) once everything passes.
      - name: Validate recipes/*.md
        run: |
          mkdir -p build
          go run ./cmd/validate-recipes -format github -json build/recipes.json

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: recipes.json
          path: build/recipes.json
