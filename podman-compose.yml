version: "3.9"
services:
  db:
    image: docker.io/postgres:16
    environment:
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: recipes
      POSTGRES_DB: recipes
    ports:
      - "5432:5432"
    volumes:
      - recipes_pg:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Containerfile
    environment:
      DATABASE_URL: postgres://recipes:recipes@db:5432/recipes?sslmode=disable
      JWT_SECRET: dev-secret-change-me
      PORT: "8080"
      AUTO_MIGRATE: "true"
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  recipes_pg:
